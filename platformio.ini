[env:lilygo-t-display-s3]
platform = espressif32
board = lilygo-t-display-s3
framework = arduino

upload_speed = 921600
monitor_speed = 115200
upload_port = COM4
monitor_port = COM4

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM

lib_deps =
    lovyan03/LovyanGFX@^1.1.16
